name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run unit and integration tests
        run: uv run python -m unittest discover -s tests -v

      - name: Run deterministic demo
        run: uv run python demo.py

      - name: Run sanity evaluation
        run: uv run python evaluate.py

      - name: Run offline RAG demo
        run: uv run python demo_rag.py