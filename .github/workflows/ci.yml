name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Tests · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Compile sources
        run: |
          PYTHONPYCACHEPREFIX=/tmp/itmo-aith-pycache \
          uv run python -m compileall src app.py demo.py demo_rag.py evaluate.py tests

      - name: Run tests
        run: uv run python -m unittest discover -s tests -v

  smoke:
    name: PoC smoke scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Happy / risky / outage demo
        run: uv run python demo.py

      - name: Sanity evaluation
        run: uv run python evaluate.py

      - name: Offline RAG demo
        run: uv run python demo_rag.py